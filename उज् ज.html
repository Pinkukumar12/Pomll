<!DOCTYPE html><html lang="en"><head>    <meta charset="UTF-8">    <meta name="viewport" content="width=device-width, initial-scale=1.0">    <title>App Page Generator</title>    <style>             input, textarea, button { margin-bottom: 10px; padding: 10px; width: 100%; }        .output { margin-top: 20px; padding: 20px; background-color: #f0f0f0; display: none; }        .output pre { background-color: #fff; padding: 20px; border-radius: 5px; white-space: pre-wrap; word-wrap: break-word; }        #screenshotContainer { display: flex; flex-wrap: wrap; gap: 10px; }        .screenshotInput { display: flex; gap: 10px; }        .screenshotInput input { flex: 1; }        #copyButton { margin-top: 10px; padding: 10px; background-color: #4CAF50; color: white; border: none; cursor: pointer; }        #copyButton:hover { background-color: #45a049; }    </style></head><body>    <h1>App Page Generator</h1>    <form id="appForm">        <!-- Form fields as before -->        <label for="appName">App Name:</label>        <input type="text" id="appName" placeholder="Enter App Name" required>        <label for="appPublisher">Publisher Link:</label>        <input type="text" id="appPublisher" placeholder="Enter Publisher URL" required>        <label for="appGenre">Genre:</label>        <input type="text" id="appGenre" placeholder="Enter Genre" required>        <label for="appSize">Size:</label>        <input type="text" id="appSize" placeholder="Enter App Size" required>        <label for="appVersion">Latest Version:</label>        <input type="text" id="appVersion" placeholder="Enter Latest Version" required>        <label for="modInfo">MOD Info:</label>        <input type="text" id="modInfo" placeholder="Enter MOD Info" required>        <label for="googlePlayLink">Google Play Link:</label>        <input type="url" id="googlePlayLink" placeholder="Enter Google Play URL" required>        <label for="megaDownloadLink">Mega Download Link:</label>        <input type="url" id="megaDownloadLink" placeholder="Enter Mega Download Link" required>        <label for="appImage">App logo:</label>        <input type="url" id="appImage" placeholder="Enter App Banner Image URL" required>        <label>Screenshots (6 required):</label>        <div id="screenshotContainer">            <input type="url" placeholder="Enter Screenshot URL" required>            <input type="url" placeholder="Enter Screenshot URL" required>            <input type="url" placeholder="Enter Screenshot URL" required>            <input type="url" placeholder="Enter Screenshot URL" required>            <input type="url" placeholder="Enter Screenshot URL" required>            <input type="url" placeholder="Enter Screenshot URL" required>        </div>        <label for="appDescription">App Description:</label>        <textarea id="appDescription" rows="5" placeholder="Enter App Description (HTML Supported)" required></textarea>        <button type="button" onclick="generateCode()">Generate Code</button>    </form>    <div class="output" id="generatedCode">        <h2>Generated HTML Code:</h2>        <pre id="htmlCode"></pre>        <!-- Copy button to copy the code -->        <button id="copyButton" onclick="copyToClipboard()">Copy Code</button>    </div>    <!-- Link to external JavaScript file -->    <script src="https://cdn.jsdelivr.net/gh/Pinkukumar12/Pomll@main/%E0%A4%AF%E0%A4%BE%20%E0%A4%A8.js">    </script>    </body></html>
